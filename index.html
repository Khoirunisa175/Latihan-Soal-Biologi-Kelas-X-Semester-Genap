<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Biologi Kelas X Semester Genap - AAS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap');

  :root {
    --hijau: #1a6b3a;
    --hijau-muda: #2d9e5f;
    --hijau-pucat: #e8f5ed;
    --hijau-tepi: #c5e8d4;
    --teks: #1a2a1e;
    --teks-abu: #4a5e52;
    --putih: #ffffff;
    --abu-terang: #f4f8f5;
    --kuning: #f0c040;
    --merah: #c0392b;
    --biru: #2d6fa4;
    --bayangan: 0 2px 16px rgba(26,107,58,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Source Sans 3', sans-serif;
    background: var(--abu-terang);
    color: var(--teks);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--hijau) 0%, var(--hijau-muda) 100%);
    color: var(--putih);
    padding: 32px 24px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -30px; left: -20px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
  }
  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .header p {
    font-size: 0.95rem;
    opacity: 0.88;
  }
  .badge-soal {
    display: inline-block;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 4px 16px;
    font-size: 0.85rem;
    margin-top: 10px;
    letter-spacing: 0.5px;
  }

  /* IDENTITAS */
  .identitas-card {
    max-width: 720px;
    margin: 28px auto 0;
    background: var(--putih);
    border-radius: 14px;
    padding: 28px 28px 22px;
    box-shadow: var(--bayangan);
    border-top: 4px solid var(--hijau);
  }
  .identitas-card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--hijau);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 560px) { .form-row { grid-template-columns: 1fr; } }
  .form-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--teks-abu);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-group input, .form-group select {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--hijau-tepi);
    border-radius: 8px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.97rem;
    background: var(--hijau-pucat);
    color: var(--teks);
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--hijau-muda);
    background: #fff;
  }

  /* PROGRESS */
  .progress-bar-wrap {
    max-width: 720px;
    margin: 20px auto 0;
    padding: 0 4px;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    color: var(--teks-abu);
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 8px;
    background: var(--hijau-tepi);
    border-radius: 8px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--hijau), var(--hijau-muda));
    border-radius: 8px;
    transition: width 0.4s;
    width: 0%;
  }

  /* SECTION */
  .section-block {
    max-width: 720px;
    margin: 24px auto 0;
  }
  .section-header {
    background: var(--hijau);
    color: var(--putih);
    padding: 12px 22px;
    border-radius: 10px 10px 0 0;
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-num {
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem;
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 600;
    flex-shrink: 0;
  }

  /* SOAL */
  .soal-card {
    background: var(--putih);
    border-left: 4px solid var(--hijau-tepi);
    margin: 0;
    padding: 20px 22px 18px;
    border-bottom: 1px solid var(--hijau-pucat);
    transition: background 0.2s;
  }
  .soal-card:last-child { border-bottom: none; border-radius: 0 0 10px 10px; }
  .soal-card.answered { border-left-color: var(--hijau-muda); background: #fafffe; }
  .soal-nomor {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--hijau);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .soal-teks {
    font-size: 0.97rem;
    line-height: 1.6;
    color: var(--teks);
    margin-bottom: 14px;
    font-weight: 500;
  }
  .opsi-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .opsi-item label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
    padding: 9px 13px;
    border-radius: 8px;
    border: 1.5px solid #e0ede6;
    background: var(--abu-terang);
    transition: all 0.18s;
    font-size: 0.94rem;
    line-height: 1.5;
  }
  .opsi-item label:hover { border-color: var(--hijau-muda); background: var(--hijau-pucat); }
  .opsi-item input[type="radio"] { display: none; }
  .opsi-item input[type="radio"]:checked + label {
    border-color: var(--hijau);
    background: var(--hijau-pucat);
    font-weight: 600;
    color: var(--hijau);
  }
  .opsi-huruf {
    min-width: 22px; height: 22px;
    background: var(--hijau-tepi);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--hijau);
    flex-shrink: 0;
    margin-top: 1px;
  }
  .opsi-item input[type="radio"]:checked + label .opsi-huruf {
    background: var(--hijau);
    color: white;
  }

  /* PENJELASAN (tersembunyi sebelum submit) */
  .penjelasan {
    display: none;
    margin-top: 12px;
    padding: 11px 14px;
    background: #fffdf0;
    border-left: 3px solid var(--kuning);
    border-radius: 6px;
    font-size: 0.88rem;
    line-height: 1.55;
    color: #5a4a10;
  }

  /* TOMBOL SUBMIT */
  .submit-wrap {
    max-width: 720px;
    margin: 24px auto 40px;
    text-align: center;
  }
  .btn-submit {
    background: linear-gradient(135deg, var(--hijau) 0%, var(--hijau-muda) 100%);
    color: white;
    border: none;
    padding: 16px 52px;
    border-radius: 50px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 18px rgba(26,107,58,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(26,107,58,0.35); }
  .btn-submit:active { transform: translateY(0); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .peringatan-submit {
    margin-top: 10px;
    font-size: 0.85rem;
    color: var(--teks-abu);
  }

  /* HASIL */
  .hasil-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .hasil-overlay.tampil { display: flex; }
  .hasil-card {
    background: white;
    border-radius: 18px;
    padding: 36px 32px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    animation: munculHasil 0.35s ease;
  }
  @keyframes munculHasil {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .nilai-besar {
    font-family: 'Playfair Display', serif;
    font-size: 5rem;
    font-weight: 700;
    line-height: 1;
    margin: 10px 0 6px;
  }
  .nilai-besar.lulus { color: var(--hijau); }
  .nilai-besar.tidak-lulus { color: var(--merah); }
  .label-nilai { font-size: 0.9rem; color: var(--teks-abu); text-transform: uppercase; letter-spacing: 1px; }
  .info-hasil {
    font-size: 0.92rem;
    color: var(--teks-abu);
    margin: 16px 0 24px;
    line-height: 1.6;
  }
  .info-hasil strong { color: var(--teks); }
  .pesan-lulus {
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 20px;
  }
  .pesan-lulus.lulus { background: var(--hijau-pucat); color: var(--hijau); }
  .pesan-lulus.tidak-lulus { background: #fdecea; color: var(--merah); }
  .btn-tutup {
    background: var(--hijau);
    color: white;
    border: none;
    padding: 12px 36px;
    border-radius: 50px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.97rem;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .kirim-status {
    font-size: 0.83rem;
    color: var(--teks-abu);
    margin-top: 8px;
  }
  .kirim-status.sukses { color: var(--hijau); }
  .kirim-status.gagal { color: var(--merah); }

  /* HIGHLIGHT setelah submit */
  .opsi-item.benar label { border-color: #27ae60 !important; background: #eafaf1 !important; color: #1a6b3a !important; font-weight: 600; }
  .opsi-item.salah label { border-color: var(--merah) !important; background: #fdecea !important; color: var(--merah) !important; }
  .opsi-item.benar .opsi-huruf { background: #27ae60; color: white; }
  .opsi-item.salah .opsi-huruf { background: var(--merah); color: white; }

  .seksi-skor {
    max-width: 720px;
    margin: 24px auto 0;
    display: none;
  }
  .seksi-skor.tampil { display: block; }
  .skor-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  @media (max-width: 560px) { .skor-grid { grid-template-columns: repeat(2, 1fr); } }
  .skor-item {
    background: white;
    border-radius: 10px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: var(--bayangan);
  }
  .skor-item .label { font-size: 0.75rem; color: var(--teks-abu); margin-bottom: 4px; }
  .skor-item .angka { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--hijau); font-weight: 700; }
</style>
</head>
<body>

<div class="header">
  <h1>Kuis Biologi Kelas X</h1>
  <p>Persiapan Asesmen Akhir Semester (AAS) - Semester Genap</p>
  <div class="badge-soal">75 Soal Pilihan Ganda</div>
</div>

<!-- IDENTITAS -->
<div class="identitas-card">
  <h2>&#9998; Data Siswa</h2>
  <div class="form-row">
    <div class="form-group">
      <label>Nama Lengkap</label>
      <input type="text" id="inputNama" placeholder="Tulis nama lengkap kamu..." autocomplete="off">
    </div>
    <div class="form-group">
      <label>Kelas</label>
      <select id="inputKelas">
        <option value="">-- Pilih Kelas --</option>
        <option>X-1</option><option>X-2</option><option>X-3</option>

        <option>X-7</option><option>X-8</option><option>X-9</option><option>X-10</option>

  </div>
</div>

<!-- PROGRESS -->
<div class="progress-bar-wrap">
  <div class="progress-info">

    <span id="progPersen">0%</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
</div>

<!-- SOAL AKAN DI-RENDER DI SINI OLEH JS -->
<div id="soalContainer"></div>

<!-- RINGKASAN SKOR PER BAGIAN -->
<div class="seksi-skor" id="seksiSkor">

  <div class="skor-grid">
    <div class="skor-item"><div class="label">Invertebrata</div><div class="angka" id="skor1">-</div></div>
    <div class="skor-item"><div class="label">Vertebrata</div><div class="angka" id="skor2">-</div></div>
    <div class="skor-item"><div class="label">Ekologi</div><div class="angka" id="skor3">-</div></div>
    <div class="skor-item"><div class="label">Bioteknologi</div><div class="angka" id="skor4">-</div></div>
    <div class="skor-item"><div class="label">Perub. Lingkungan</div><div class="angka" id="skor5">-</div></div>
  </div>
</div>

<!-- SUBMIT -->
<div class="submit-wrap">
  <button class="btn-submit" id="btnSubmit" onclick="submitKuis()">Kumpulkan Jawaban</button>
  <div class="peringatan-submit" id="pesanSubmit">Pastikan semua soal sudah dijawab sebelum mengumpulkan.</div>
</div>

<!-- OVERLAY HASIL -->
<div class="hasil-overlay" id="hasilOverlay">
  <div class="hasil-card">
    <div class="label-nilai">Nilai Kamu</div>
    <div class="nilai-besar" id="nilaiAngka">0</div>
    <div class="pesan-lulus" id="pesanLulus"></div>
    <div class="info-hasil" id="infoHasil"></div>
    <button class="btn-tutup" onclick="tutupHasil()">Lihat Pembahasan</button>
    <div class="kirim-status" id="kirimStatus"></div>
  </div>
</div>

// ========================================================
// RENDER SOAL
// ========================================================
const BAGIAN_INFO = [
  { nama: "Invertebrata", rentang: [1, 15] },
  { nama: "Vertebrata", rentang: [16, 30] },
  { nama: "Ekologi dan Jenis Ekosistem", rentang: [31, 45] },
  { nama: "Bioteknologi", rentang: [46, 60] },
  { nama: "Perubahan Lingkungan", rentang: [61, 75] }
];

const container = document.getElementById('soalContainer');
const HURUF = ['A','B','C','D','E'];

BAGIAN_INFO.forEach((bagian, bi) => {
  const sec = document.createElement('div');
  sec.className = 'section-block';

  const hdr = document.createElement('div');
  hdr.className = 'section-header';
  hdr.innerHTML = `<div class="section-num">${bi+1}</div> ${bagian.nama}`;
  sec.appendChild(hdr);

  const soalBagian = soalData.filter(s => s.bagian === bi+1);
  soalBagian.forEach((soal, si) => {
    const card = document.createElement('div');
    card.className = 'soal-card';
    card.id = `soal-${soal.no}`;

    const noEl = document.createElement('div');
    noEl.className = 'soal-nomor';
    noEl.textContent = `Soal ${soal.no}`;
    card.appendChild(noEl);

    const teks = document.createElement('div');
    teks.className = 'soal-teks';
    teks.textContent = soal.soal;
    card.appendChild(teks);

    const ul = document.createElement('ul');
    ul.className = 'opsi-list';

    soal.opsi.forEach((opsi, oi) => {
      const li = document.createElement('li');
      li.className = 'opsi-item';
      li.id = `soal-${soal.no}-opsi-${oi}`;

      const inp = document.createElement('input');
      inp.type = 'radio';
      inp.name = `soal-${soal.no}`;
      inp.value = oi;
      inp.id = `inp-${soal.no}-${oi}`;
      inp.addEventListener('change', () => updateProgress());

      const lbl = document.createElement('label');
      lbl.htmlFor = inp.id;
      lbl.innerHTML = `<span class="opsi-huruf">${HURUF[oi]}</span>${opsi}`;

      li.appendChild(inp);
      li.appendChild(lbl);
      ul.appendChild(li);
    });
    card.appendChild(ul);

    const penj = document.createElement('div');
    penj.className = 'penjelasan';
    penj.id = `penj-${soal.no}`;
    penj.textContent = soal.penjelasan;
    card.appendChild(penj);

    sec.appendChild(card);
  });

  container.appendChild(sec);
});

// ========================================================
// PROGRESS
// ========================================================
function updateProgress() {
  let dijawab = 0;
  soalData.forEach(s => {
    if (document.querySelector(`input[name="soal-${s.no}"]:checked`)) dijawab++;
  });
  const persen = Math.round((dijawab / soalData.length) * 100);
  document.getElementById('progTeks').textContent = `${dijawab} dari ${soalData.length} soal dijawab`;
  document.getElementById('progPersen').textContent = `${persen}%`;
  document.getElementById('progFill').style.width = persen + '%';

  soalData.forEach(s => {
    const card = document.getElementById(`soal-${s.no}`);
    if (document.querySelector(`input[name="soal-${s.no}"]:checked`)) {
      card.classList.add('answered');
    }
  });
}

// ========================================================
// SUBMIT
// ========================================================
function submitKuis() {
  const nama = document.getElementById('inputNama').value.trim();
  const kelas = document.getElementById('inputKelas').value;

  if (!nama) { alert('Harap isi nama lengkap terlebih dahulu.'); return; }
  if (!kelas) { alert('Harap pilih kelas terlebih dahulu.'); return; }

  let belumDijawab = [];
  soalData.forEach(s => {
    if (!document.querySelector(`input[name="soal-${s.no}"]:checked`)) {
      belumDijawab.push(s.no);
    }
  });

  if (belumDijawab.length > 0) {
    const konfirm = confirm(`Masih ada ${belumDijawab.length} soal yang belum dijawab. Tetap kumpulkan?`);
    if (!konfirm) return;
  }

  // Hitung skor
  let totalBenar = 0;
  const skorPerBagian = [0, 0, 0, 0, 0];
  const benarPerBagian = [0, 0, 0, 0, 0];

  soalData.forEach(s => {
    const selected = document.querySelector(`input[name="soal-${s.no}"]:checked`);
    const jawabSiswa = selected ? parseInt(selected.value) : -1;
    const benar = jawabSiswa === s.jawaban;
    if (benar) {
      totalBenar++;
      benarPerBagian[s.bagian - 1]++;
    }

    // Highlight opsi
    for (let oi = 0; oi < s.opsi.length; oi++) {
      const li = document.getElementById(`soal-${s.no}-opsi-${oi}`);
      if (li) {
        if (oi === s.jawaban) li.classList.add('benar');
        else if (oi === jawabSiswa && !benar) li.classList.add('salah');
      }
    }

    // Tampilkan penjelasan
    const penjEl = document.getElementById(`penj-${s.no}`);
    if (penjEl) penjEl.style.display = 'block';

    // Nonaktifkan radio
    document.querySelectorAll(`input[name="soal-${s.no}"]`).forEach(inp => inp.disabled = true);
  });

  const nilaiAkhir = Math.round((totalBenar / soalData.length) * 100);

  // Update skor per bagian
  benarPerBagian.forEach((b, i) => {
    const el = document.getElementById(`skor${i+1}`);
    if (el) el.textContent = `${b}/15`;
  });
  document.getElementById('seksiSkor').classList.add('tampil');

  // Tampilkan overlay hasil
  const overlay = document.getElementById('hasilOverlay');
  const nilaiEl = document.getElementById('nilaiAngka');
  const pesanEl = document.getElementById('pesanLulus');
  const infoEl = document.getElementById('infoHasil');

  nilaiEl.textContent = nilaiAkhir;
  nilaiEl.className = 'nilai-besar ' + (nilaiAkhir >= 75 ? 'lulus' : 'tidak-lulus');
  pesanEl.className = 'pesan-lulus ' + (nilaiAkhir >= 75 ? 'lulus' : 'tidak-lulus');
  pesanEl.textContent = nilaiAkhir >= 75 ? 'Selamat, kamu lulus!' : 'Terus semangat belajar!';
  infoEl.innerHTML = `<strong>${nama}</strong> - Kelas ${kelas}<br>Jawaban benar: <strong>${totalBenar}</strong> dari <strong>${soalData.length}</strong> soal`;

  overlay.classList.add('tampil');
  document.getElementById('btnSubmit').disabled = true;

  // Kirim ke Google Sheets
  document.getElementById('kirimStatus').textContent = 'Mengirim data ke server...';
  kirimKeSheets(nama, kelas, nilaiAkhir, totalBenar, soalData.length);
}

function tutupHasil() {
  document.getElementById('hasilOverlay').classList.remove('tampil');
  document.getElementById('soalContainer').scrollIntoView({ behavior: 'smooth' });
}

// ========================================================
// KIRIM KE GOOGLE SHEETS
// ========================================================
const APPS_SCRIPT_URL = https://script.google.com/macros/s/AKfycbxpLyIdzf9ZuFp8snOETp3X0z6oSxnq-_d9KN6clbu2O0M4IStf8cBApGDcsOGNGY09/exec;

function kirimKeSheets(nama, kelas, nilai, benar, total) {
  const payload = { nama, kelas, nilai, total: `${benar}/${total}` };
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(() => {
    document.getElementById('kirimStatus').textContent = 'Data berhasil dikirim ke rekap guru.';
    document.getElementById('kirimStatus').className = 'kirim-status sukses';
  })
  .catch(() => {
    document.getElementById('kirimStatus').textContent = 'Gagal mengirim data. Catat nilaimu secara manual.';
    document.getElementById('kirimStatus').className = 'kirim-status gagal';
  });
}
